name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sources
        run: python -m compileall -q cone_project tests
      - name: Run tests without private data or models
        run: python -m unittest discover -s tests -v
